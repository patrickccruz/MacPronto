# Inativo aqui. Para ativar, mova para .github/workflows/build.yml
# (o token do gh precisa do escopo workflow: gh auth refresh -h github.com -s workflow).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências Python
        run: python -m pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check src tests scripts

      - name: Testes Python
        run: python -m pytest -q

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build:
    name: Executável
    needs: test
    # A build leva vários minutos: só roda manualmente ou ao publicar uma versão (tag v*)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache do Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Dependências
        run: python -m pip install -e ".[build]"

      - name: Build
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: MacPronto
          path: |
            dist/*.zip
            dist/*-instalador.exe
          if-no-files-found: error

      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*-instalador.exe --title "MacPronto ${{ github.ref_name }}" --generate-notes
